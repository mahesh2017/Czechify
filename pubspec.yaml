name: czechify
description: AI-powered Czech language learning app for CEFR A1/A2 proficiency.
publish_to: 'none'
version: 1.0.6+10

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Localization (gen-l10n) — foundation for translating the UI chrome.
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.9

  # State Management & Routing
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0

  # Database & Storage
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.6.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^10.0.0

  # Audio
  just_audio: ^0.10.0
  record: ^7.0.0

  # Speech (OS-native, fallback only)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.0

  # Animations (teacher character on teaching cards)
  lottie: ^3.1.2

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^7.0.0

  # Backend / sync (offline-first)
  supabase_flutter: ^2.5.0
  google_sign_in: ^7.2.0
  uuid: ^4.0.0

  # Utilities
  collection: ^1.18.0
  path: ^1.9.0
  path_provider: ^2.1.0
  crypto: ^3.0.0
  logging: ^1.2.0
  share_plus: ^13.0.0
  # Hands an AI-reply report off to the learner's mail app. Direct dependency
  # because we call it directly, even though share_plus already pulls it in.
  url_launcher: ^6.3.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  app_settings: ^8.0.3
  package_info_plus: ^10.2.1
  # Google Play's native flexible in-app update flow (Android only).
  in_app_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation (Drift)
  build_runner: ^2.4.0
  drift_dev: ^2.34.0
  sqlite3: ^3.0.0

  # Linting
  flutter_lints: ^6.0.0

  # App icon generation (dart run flutter_launcher_icons)
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: assets/images/app_icon.png
  android: true
  adaptive_icon_background: "#415AE8"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/images/app_icon.png
  windows:
    generate: true
    image_path: assets/images/app_icon.png

flutter:
  uses-material-design: true
  generate: true # gen-l10n from lib/l10n/*.arb

  assets:
    - assets/images/
    - assets/images/unit01/
    - assets/images/unit02/
    - assets/images/unit03/
    - assets/images/unit04/
    - assets/images/unit05/
    - assets/images/unit06/
    - assets/images/unit07/
    - assets/images/unit08/
    - assets/images/unit09/
    - assets/images/unit10/
    - assets/images/unit11/
    - assets/images/unit12/
    - assets/images/unit13/
    - assets/images/unit14/
    - assets/images/unit15/
    - assets/images/unit16/
    - assets/images/unit17/
    - assets/images/unit18/
    - assets/images/unit19/
    - assets/images/unit20/
    - assets/images/unit21/
    - assets/images/unit22/
    - assets/images/unit23/
    - assets/images/unit24/
    - assets/images/unit25/
    - assets/images/unit26/
    - assets/images/unit27/
    - assets/images/unit29/
    - assets/images/unit28/
    - assets/images/unit30/
    - assets/images/unit31/
    - assets/animations/
    # Synthesized by tool/generate_sfx.py — see that script before editing,
    # these are generated output rather than hand-authored files.
    - assets/sfx/
    - assets/curriculum/
    - assets/curriculum/lessons/
    - assets/vocabulary/
    # Which audio clips belong to which unit. Bundled, not downloaded: the app
    # needs it to know what to pre-fetch, which has to work before it has any
    # network. The clips themselves stay remote.
    - assets/audio/offline_units.json
    # Just the teacher-preview clips, so the voice picker can play the
    # real Lenka/Pavel before the 138MB pack has downloaded. Everything
    # else in assets/audio/ is uploaded to Supabase, not bundled.
    - assets/audio/female_2f44c5669abb492049b767f78d72f275298c2dd68e8ff0d575c2544eddf9c762.mp3
    - assets/audio/male_2f44c5669abb492049b767f78d72f275298c2dd68e8ff0d575c2544eddf9c762.mp3

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk.ttf
