name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. This workflow runs pull-request code, so the token it
# runs with should not be able to write to the repository; the one job that
# needs more asks for it itself.
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover needs the PR/base merge base, which is absent from the
          # default one-commit checkout.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting-safe analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        # Runners default to UTC, which never changes offset — so any test of
        # local-time scheduling passes there whether or not the code handles a
        # DST transition. Pinning the audience's zone makes those assertions
        # mean something. See test/notifications/reminder_scheduler_test.dart.
        env:
          TZ: Europe/Prague
        run: flutter test --coverage

      - name: Enforce changed-line coverage
        if: ${{ github.event_name == 'pull_request' }}
        # The base name reaches the shell as an environment variable, never as
        # `${{ }}` interpolated into the script. Git accepts a branch called
        # `audit-$(id)`, and interpolation pastes that name into the script
        # before bash sees it — the substitution then runs. A quoted expansion
        # of this variable is just a string.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -m pip install diff-cover
          # Every PR is judged at 80% of its changed lines.
          #
          # Four pre-release integration branches once carried their own lower
          # baselines here — each consolidated the legacy app, generated code
          # and a whole remediation history into a single diff that could not
          # clear the normal bar. All four have merged and their branches are
          # gone, so the arms could never match again; they are removed rather
          # than left as rules for branches that do not exist.
          #
          # The habit that replaced them is worth keeping: split the work into
          # PRs small enough to be tested on their own. Every PR since has
          # cleared 80% unaided.
          #
          # One measurement caveat survives them. Two CI runs over identical
          # Dart code have reported 207 and 212 missing lines out of 723 — the
          # figure moves about half a point between runs, so treat a result
          # within noise of the threshold as unresolved rather than passing.
          threshold=80
          # Preserve the merge base. A depth-one fetch breaks diff-cover when
          # the target branch tip is itself a merge commit.
          git fetch origin "$BASE_REF"
          # Generated Drift and localization output is verified by generation,
          # analysis, tests, and builds; keep the changed-line gate focused on
          # source that engineers can meaningfully unit test.
          #
          # Drift table *definitions* belong in the same category. Their column
          # getters are read by drift_dev at build time to emit the real table
          # class into .g.dart; nothing calls them at runtime, so they report
          # as uncovered however thoroughly the table is exercised. Three
          # consecutive PRs measured this — 8, 4 and 11 uncovered lines, purely
          # for adding columns — which understates every schema change and
          # pushes the incentive toward not writing the declaration rather than
          # toward testing it.
          #
          # The leading */ is load-bearing: diff-cover matches these patterns
          # against the path in a way that a repo-rooted glob does not satisfy.
          # "lib/data/database/tables/*.dart" reads correctly and excludes
          # nothing, which is the sort of mistake that looks like it worked.
          diff-cover coverage/lcov.info \
            --compare-branch="origin/$BASE_REF" \
            --exclude "*.g.dart" "app_localizations_*.dart" \
              "*/database/tables/*.dart" \
            --fail-under="$threshold"

      - name: Capture dependency evidence
        run: |
          mkdir -p build/quality
          flutter pub deps --json > build/quality/dependency-graph.json
          flutter pub outdated > build/quality/outdated-dependencies.txt || true
          flutter test \
            test/data/curriculum_contract_validator_test.dart \
            --reporter json \
            > build/quality/content-publication-tests.json

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-quality-evidence
          path: |
            coverage/lcov.info
            build/quality/

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    # GitHub Dependency Review requires a repository-level dependency graph,
    # which is unavailable for this repository. OSV scans Dart's pubspec.lock
    # directly and keeps the vulnerability gate independent of that setting.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      scan-args: |-
        --lockfile=pubspec.lock
      fail-on-vuln: true

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format, lint, and type-check Edge Functions
        run: |
          deno fmt --check supabase/functions
          deno lint supabase/functions
          deno check \
            supabase/functions/account-data/index.ts \
            supabase/functions/deepseek-proxy/index.ts \
            supabase/functions/whisper-proxy/index.ts

      - name: Run Edge Function policy tests
        run: deno test --allow-env supabase/functions

      - name: Smoke deployed JWT gates
        if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
        run: tool/smoke_edge_functions.sh "${{ vars.SUPABASE_PROJECT_REF }}"

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. Resolving `latest` is an unauthenticated
          # GitHub API call that fails the whole job with "rate limit exceeded"
          # for reasons no commit can influence — it has already happened once.
          # A pin also stops a new CLI release changing migration or pgTAP
          # behaviour with nothing in the diff to explain it. This is the
          # version the suite is verified against; bump it deliberately.
          version: 2.109.1

      - name: Start local Supabase and apply every migration
        run: supabase start

      - name: Prove a clean database reset
        run: supabase db reset

      - name: Run pgTAP security, RLS, sync, and release tests
        run: supabase test db

      - name: Lint the resulting database
        run: supabase db lint --level warning

  build-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
          - os: macos-latest
            target: ios
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "ios" ]; then
            flutter build ios --debug --no-codesign
          else
            flutter build "${{ matrix.target }}" --debug
          fi
